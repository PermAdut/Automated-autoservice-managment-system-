# ==============================================================================
# Development overrides — automatically merged with docker-compose.yml
# ==============================================================================

name: autoservice

services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  pgbouncer:
    ports:
      - "6432:6432"

  server:
    build:
      target: development
    volumes:
      - ./server/src:/app/src
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
    command: ["npm", "run", "start:dev"]

  worker:
    build:
      target: development
    volumes:
      - ./server/src:/app/src
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
    command: ["npx", "ts-node", "-r", "tsconfig-paths/register", "src/worker.ts"]
